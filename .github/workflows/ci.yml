name: CI

on:
  push:
    branches: [main, master]

jobs:
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.1
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install pydantic pydantic-settings sqlalchemy pymysql python-dotenv httpx pytest
      - name: 运行测试
        run: pytest tests/unit/ -v --tb=short
        env:
          APP_ENV: testing
