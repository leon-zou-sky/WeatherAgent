# GitHub Actions CI 配置
# 触发条件：push 和 pull_request

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

# 取消同一分支的重复运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============ 代码检查 ============
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Ruff
        run: pip install ruff

      - name: Ruff 代码检查
        run: ruff check .

      - name: Ruff 格式检查
        run: ruff format --check .

  # ============ 单元测试 ============
  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 运行单元测试
        run: |
          pytest tests/ -v -m "unit or not integration" \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-results.xml
        env:
          APP_ENV: testing

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            htmlcov/

      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v3
        if: success()
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # ============ 集成测试 ============
  integration-tests:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: weather_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: 等待 MySQL 就绪
        run: |
          for i in $(seq 1 30); do
            mysqladmin ping -h 127.0.0.1 -P 3306 -u root -ptest_password && break
            echo "等待 MySQL... ($i/30)"
            sleep 2
          done

      - name: 初始化数据库
        run: |
          python -m downloader.main --init-db
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: weather_test

      - name: 运行集成测试
        run: |
          pytest tests/ -v -m "integration" \
            --cov=app \
            --cov-report=xml \
            --junitxml=integration-test-results.xml
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: weather_test

      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-test-results.xml

  # ============ 构建检查 ============
  build:
    name: 构建检查
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查依赖安装
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import app; print('✅ app 模块导入成功')"

      - name: 检查 Docker 构建
        run: |
          docker build -t weather-agent:test .
          echo "✅ Docker 构建成功"
