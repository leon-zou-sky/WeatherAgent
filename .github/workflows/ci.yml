# GitHub Actions CI - 简化版
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings sqlalchemy pymysql httpx python-dotenv pytest pytest-cov

      - name: 运行测试
        run: |
          pytest tests/unit/ tests/test_simple.py tests/test_aqi_unit.py -v --tb=short
        env:
          APP_ENV: testing
