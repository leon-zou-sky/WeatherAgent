# Pre-commit 钩子配置
# 安装: pre-commit install
# 手动运行: pre-commit run --all-files

repos:
  # Ruff - 代码检查和格式化
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # 通用检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace        # 移除行尾空格
      - id: end-of-file-fixer          # 确保文件以换行结尾
      - id: check-yaml                 # 检查YAML语法
      - id: check-json                 # 检查JSON语法
      - id: check-toml                 # 检查TOML语法
      - id: check-added-large-files    # 防止提交大文件
        args: ['--maxkb=1000']
      - id: check-merge-conflict       # 检查合并冲突标记
      - id: debug-statements           # 检查debug语句
      - id: detect-private-key         # 检测私钥

  # Mypy - 类型检查（可选，较慢）
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.7.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-requests]
